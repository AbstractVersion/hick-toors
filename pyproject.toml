[project]
name = "hick-toors"
version = "0.1.0"
description = "Local hike + dog-friendly stay finder for Greece"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.28",
    "curl_cffi>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mcp[cli]>=1.6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

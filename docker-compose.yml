services:
  hick-toors:
    build: .
    image: hick-toors:local
    container_name: hick-toors
    ports:
      # Published on the machine's port 80 by default; override with HICK_TOORS_PORT=8080.
      - "${HICK_TOORS_PORT:-80}:8000"
    env_file:
      # Optional: ORS_API_KEY, WIKILOC_COOKIE, HOME_* … (see .env.example). Never baked into the image.
      - path: .env
        required: false
    volumes:
      - hick-cache:/app/.cache
      - hick-data:/app/data   # saved trips (SQLite) – survives rebuilds
    restart: unless-stopped

volumes:
  hick-cache:
  hick-data:
